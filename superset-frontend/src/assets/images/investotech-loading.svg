<!-- Investotech-branded loading spinner: the "T" icon mark from the
     Investotech logo, spinning continuously in the brand blue (#00AAF0).
     Uses SMIL <animateTransform> so it animates correctly when embedded via
     <img src="..."> (CSS animations don't run inside <img> elements). -->
<svg viewBox="0 0 73.3 73.5" xmlns="http://www.w3.org/2000/svg">
  <g fill="#00AAF0">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 36.65 36.8"
      to="360 36.65 36.8"
      dur="1.2s"
      repeatCount="indefinite"
    />
    <polygon points="10.7,5.6 10.7,18.5 23.6,5.6" />
    <polygon points="36.6,68 49.6,55 49.6,31.5 62.6,18.5 36.6,18.5" />
    <polygon points="23.6,18.5 10.7,31.5 10.7,68 23.6,55 23.6,31.5 36.6,18.5" />
  </g>
</svg>
